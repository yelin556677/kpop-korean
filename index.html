<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>K-pop 韩语学习</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --main:#ff7eb9;
  --sub:#ffd6e8;
  --bg:#fdf1f7;
  --card:#fff;
  --text:#333;
  --gray:#777;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  background:linear-gradient(135deg,var(--main),var(--sub));
  color:#fff;
  padding:16px;
}
.tabs{
  display:flex;
  gap:8px;
  padding:10px;
  background:#fff;
}
.tab{
  flex:1;
  text-align:center;
  padding:6px;
  border-radius:16px;
  background:#f1f2f7;
  font-size:12px;
}
.tab.active{
  background:var(--main);
  color:#fff;
}
.container{padding:14px;}
.card{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 6px 16px rgba(0,0,0,0.06);
}
.korean{font-size:22px;font-weight:700;}
.roman{font-size:13px;color:var(--gray);}
button{
  margin-top:8px;
  margin-right:6px;
  border:none;
  padding:6px 12px;
  border-radius:20px;
  background:var(--sub);
}
</style>
</head>

<body>

<!-- iPhone 必须的解锁按钮 -->
<button id="unlockAudio" style="
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:12px 18px;
font-size:16px;
border-radius:20px;
border:none;
background:#ff7a9e;
color:white;
z-index:9999;">
🔊 点击开启发音
</button>

<header>
  <span>💜 K-pop 韩语学习</span>
</header>

<div class="tabs">
  <div class="tab active" onclick="go('idol',this)">追星</div>
  <div class="tab" onclick="go('daily',this)">日常</div>
  <div class="tab" onclick="go('words',this)">生词本</div>
</div>

<div class="container" id="app"></div>

<script>
/* ========== 数据 ========== */
let page="idol";
const data={
  idol:[
    {k:"응원해요",r:"Eung-won-hae-yo"},
    {k:"수고했어요",r:"Su-go-hae-sseo-yo"},
    {k:"진짜 멋있어요",r:"Jin-jja meo-sit-sseo-yo"},
    {k:"항상 고마워요",r:"Hang-sang go-ma-wo-yo"}
  ],
  daily:[
    {k:"이거 얼마예요?",r:"I-geo eol-ma-ye-yo"},
    {k:"괜찮아요",r:"Gwaen-chan-a-yo"},
    {k:"잠깐만요",r:"Jam-kkan-man-yo"},
    {k:"다시 말해 주세요",r:"Da-si mal-hae ju-se-yo"}
  ]
};

/* ========== 页面渲染 ========== */
function go(p,el){
  page=p;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  render();
}

function render(){
  const box=document.getElementById("app");
  box.innerHTML="";
  data[page].forEach(i=>{
    box.innerHTML+=`
      <div class="card">
        <div class="korean">${i.k}</div>
        <div class="roman">${i.r}</div>
        <button onclick="speak('${i.k}')">▶ 发音</button>
        <button onclick="save('${i.k}')">⭐ 生词</button>
      </div>`;
  });
}

function save(w){
  let list=JSON.parse(localStorage.getItem("words")||"[]");
  if(!list.includes(w)){
    list.push(w);
    localStorage.setItem("words",JSON.stringify(list));
    alert("已加入生词本");
  }
}

/* =====================
   iPhone 发音最终稳定版
   ===================== */

let unlocked = false;

/* 必须由用户点击解锁（iOS 限制） */
document.getElementById("unlockAudio").addEventListener("click", () => {
  const u = new SpeechSynthesisUtterance("hello");
  u.rate = 1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);

  unlocked = true;
  document.getElementById("unlockAudio").style.display = "none";
});

/* 核心发音函数（听感已优化） */
function speak(text){
  if(!unlocked){
    alert("请先点击『开启发音』");
    return;
  }

  const voices = speechSynthesis.getVoices();
  const koVoice = voices.find(v =>
    v.lang === "ko-KR" || v.lang.startsWith("ko")
  );

  if(!koVoice){
    alert(
      "检测不到韩语语音\n\n" +
      "请前往：设置 → 辅助功能 → 朗读内容 → 声音 → 下载【韩语·女性】"
    );
    return;
  }

  const u = new SpeechSynthesisUtterance(text);
  u.voice = koVoice;
  u.lang = "ko-KR";

  /* 🔧 听感优化参数 */
  u.rate = 0.85;
  u.pitch = 1.05;
  u.volume = 1;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

render();
</script>

</body>
</html>
