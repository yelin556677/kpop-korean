<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>K-pop 韩语学习</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --main:#ff7eb9;
  --sub:#ffd6e8;
  --bg:#fdf1f7;
  --card:#fff;
  --text:#333;
  --gray:#777;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:linear-gradient(135deg,var(--main),var(--sub));
  color:#fff;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tabs{
  display:flex;
  gap:8px;
  padding:10px;
  background:#fff;
}

.tab{
  flex:1;
  text-align:center;
  padding:6px;
  border-radius:16px;
  background:#f1f2f7;
  font-size:12px;
}

.tab.active{
  background:var(--main);
  color:#fff;
}

.container{
  padding:14px;
}

.card{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 6px 16px rgba(0,0,0,0.06);
}

.korean{font-size:22px;font-weight:700;}
.roman{font-size:13px;color:var(--gray);}

button{
  margin-top:8px;
  margin-right:6px;
  border:none;
  padding:8px 14px;
  border-radius:20px;
  background:var(--sub);
}
</style>
</head>

<body>

<!-- 🔊 解锁按钮（iOS 必须） -->
<button id="unlockAudio" style="
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
padding: 14px 20px;
font-size: 16px;
border-radius: 24px;
border: none;
background: #ff7a9e;
color: white;
z-index: 9999;">
🔊 点击开启发音
</button>

<header>
  <span>💜 K-pop 韩语学习</span>
</header>

<div class="tabs">
  <div class="tab active" onclick="go('idol',this)">追星</div>
  <div class="tab" onclick="go('daily',this)">日常</div>
  <div class="tab" onclick="go('words',this)">生词本</div>
</div>

<div class="container" id="app"></div>

<!-- ✅ iPhone Safari 专用 JS -->
<script>
let page = "idol";
let unlocked = false;

/* 数据 */
const data = {
  idol:[
    {k:"응원해요",r:"Eung-won-hae-yo"},
    {k:"수고했어요",r:"Su-go-hae-sseo-yo"},
    {k:"항상 고마워요",r:"Hang-sang go-ma-wo-yo"},
    {k:"사랑해요",r:"Sa-rang-hae-yo"}
  ],
  daily:[
    {k:"이거 얼마예요?",r:"I-geo eol-ma-ye-yo"},
    {k:"화장실 어디예요?",r:"Hwa-jang-sil eo-di-ye-yo"},
    {k:"괜찮아요",r:"Gwaen-chan-a-yo"},
    {k:"잠깐만요",r:"Jam-kkan-man-yo"}
  ]
};

/* 切换页面 */
function go(p,el){
  page=p;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  render();
}

/* 🔓 解锁语音（必须点） */
document.getElementById("unlockAudio").addEventListener("click",()=>{
  const u = new SpeechSynthesisUtterance("audio unlocked");
  u.lang="en-US";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);

  unlocked = true;
  document.getElementById("unlockAudio").style.display="none";
});

/* 🔊 发音函数（iOS 安全） */
function speak(text){
  if(!unlocked){
    alert("请先点击底部『开启发音』");
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang="ko-KR";
  u.rate=0.9;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* 生词保存 */
function save(w){
  let list=JSON.parse(localStorage.getItem("words")||"[]");
  if(!list.includes(w)){
    list.push(w);
    localStorage.setItem("words",JSON.stringify(list));
  }
}

/* 渲染 */
function render(){
  const box=document.getElementById("app");
  box.innerHTML="";

  if(page==="words"){
    const list=JSON.parse(localStorage.getItem("words")||"[]");
    if(list.length===0){
      box.innerHTML="<div class='card'>暂无生词</div>";
      return;
    }
    list.forEach(w=>{
      box.innerHTML+=`
      <div class="card">
        <div class="korean">${w}</div>
        <button onclick="speak('${w}')">▶ 发音</button>
      </div>`;
    });
    return;
  }

  data[page].forEach(i=>{
    box.innerHTML+=`
    <div class="card">
      <div class="korean">${i.k}</div>
      <div class="roman">${i.r}</div>
      <button onclick="speak('${i.k}')">▶ 发音</button>
      <button onclick="save('${i.k}')">⭐ 生词</button>
    </div>`;
  });
}

/* 🔍 测试按钮（必听） */
document.body.insertAdjacentHTML("beforeend",`
<button style="
position:fixed;
bottom:90px;
left:50%;
transform:translateX(-50%);
padding:10px 16px;
border-radius:20px;
border:none;"
onclick="speechSynthesis.speak(new SpeechSynthesisUtterance('hello'))">
测试声音
</button>
`);

render();
</script>

</body>
</html>
