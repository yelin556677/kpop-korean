<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>K-pop 韩语学习</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --main:#ff7eb9;
  --sub:#ffd6e8;
  --bg:#fdf1f7;
  --card:#fff;
  --text:#333;
  --gray:#777;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:linear-gradient(135deg,var(--main),var(--sub));
  color:#fff;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header span{
  font-weight:600;
}

.theme{
  font-size:14px;
  cursor:pointer;
}

.tabs{
  display:flex;
  gap:8px;
  padding:10px;
  background:#fff;
}

.tab{
  flex:1;
  text-align:center;
  padding:6px;
  border-radius:16px;
  background:#f1f2f7;
  font-size:12px;
}

.tab.active{
  background:var(--main);
  color:#fff;
}

.container{
  padding:14px;
}

.card{
  background:var(--card);
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 6px 16px rgba(0,0,0,0.06);
}

.korean{font-size:22px;font-weight:700;}
.roman{font-size:13px;color:var(--gray);}
button{
  margin-top:8px;
  margin-right:6px;
  border:none;
  padding:6px 12px;
  border-radius:20px;
  background:var(--sub);
}

.select{
  padding:10px;
  background:#fff;
  border-radius:14px;
  margin-bottom:12px;
}
</style>
</head>

<body>

<header>
  <span>💜 K-pop 韩语学习</span>
  <span class="theme" onclick="switchTheme()">🎨</span>
</header>

<div class="tabs">
  <div class="tab active" onclick="go('idol',this)">追星</div>
  <div class="tab" onclick="go('daily',this)">日常</div>
  <div class="tab" onclick="go('words',this)">生词本</div>
  <div class="tab" onclick="go('bias',this)">本命</div>
</div>

<div class="container" id="app"></div>

<script>
let page="idol";
let theme=localStorage.getItem("theme")||"pink";
applyTheme(theme);

const data={
idol:[
  {k:"응원해요",r:"Eung-won-hae-yo"},
  {k:"수고했어요",r:"Su-go-hae-sseo-yo"}
],
daily:[
  {k:"이거 얼마예요?",r:"I-geo eol-ma-ye-yo"}
]
};

function go(p,el){
  page=p;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  render();
}

function speak(t){
  const u=new SpeechSynthesisUtterance(t);
  u.lang="ko-KR";
  speechSynthesis.speak(u);
}

function save(w){
  let list=JSON.parse(localStorage.getItem("words")||"[]");
  if(!list.includes(w)){
    list.push(w);
    localStorage.setItem("words",JSON.stringify(list));
  }
}

function render(){
  const box=document.getElementById("app");
  box.innerHTML="";

  if(page==="words"){
    const list=JSON.parse(localStorage.getItem("words")||"[]");
    if(list.length===0){box.innerHTML="暂无生词";return;}
    box.innerHTML+=`<div class="card"><button onclick="review()">🎴 随机复习</button></div>`;
    list.forEach(w=>{
      box.innerHTML+=`
        <div class="card">
          <div class="korean">${w}</div>
          <button onclick="speak('${w}')">▶</button>
        </div>`;
    });
    return;
  }

  if(page==="bias"){
    box.innerHTML=`
      <div class="select">
        选择你的本命：
        <select onchange="setBias(this.value)">
          <option>男团</option>
          <option>女团</option>
        </select>
      </div>
      <div class="card">💖 像爱豆会说的追星韩语即将为你定制</div>`;
    return;
  }

  data[page].forEach(i=>{
    box.innerHTML+=`
      <div class="card">
        <div class="korean">${i.k}</div>
        <div class="roman">${i.r}</div>
        <button onclick="speak('${i.k}')">▶ 发音</button>
        <button onclick="save('${i.k}')">⭐ 生词</button>
      </div>`;
  });
}

function review(){
  const list=JSON.parse(localStorage.getItem("words")||"[]");
  const w=list[Math.floor(Math.random()*list.length)];
  alert("今日抽卡：" + w);
}

function switchTheme(){
  const t=["pink","blue","white","black"];
  theme=t[(t.indexOf(theme)+1)%4];
  localStorage.setItem("theme",theme);
  applyTheme(theme);
}

function applyTheme(t){
  if(t==="pink"){
    set("#ff7eb9","#ffd6e8","#fdf1f7");
  }
  if(t==="blue"){
    set("#7b7cff","#cdd8ff","#f4f6ff");
  }
  if(t==="white"){
    set("#999","#eee","#fff");
  }
  if(t==="black"){
    set("#222","#444","#000");
  }
}

function set(m,s,b){
  document.documentElement.style.setProperty("--main",m);
  document.documentElement.style.setProperty("--sub",s);
  document.documentElement.style.setProperty("--bg",b);
}

render();
</script>

</body>
</html>
